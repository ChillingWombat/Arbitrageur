title = "Arbitrageur gitleaks config"

# Source scan baseline (2026-09-20): all findings were test fixtures, UI
# placeholders, dev sentinels, or standard test vectors — not production
# credentials. Each allowlist regex fingerprints the exact matched SECRET
# string (regexTarget = "secret"), so any different secret — even in the
# same file — still fails the scan.

[extend]
useDefault = true

[allowlist]
description = "Known false positives: test vectors, UI placeholders, dev sentinels"
regexTarget = "secret"
regexes = [
  # Kraken futures-signing unit test: base64 of "secret-key-for-testing-..."
  '''c2VjcmV0LWtleS1mb3ItdGVzdGluZy0xMjM0NTY3ODkwMTIzNDU2Nzg=''',
  # Kraken unit test: expected HMAC-SHA512 signature for the fixture above
  '''I7U4L8ldFZE\+jjZv4JDtMFNJbYnSXSxqclINxdYzMcfULHT2g89T7SLoa2r72JiP\+bf8qC4Wpo9sE/GBu9fkPQ==''',
  # Vanta/Orderly Ed25519 test vector: the standard libsodium/RFC8032
  # 32-byte seed used with a PyNaCl-generated expected signature.
  '''9d61b19deffd5a60ba844af492ec2cc4449c5697b326919703bac031cae7f109''',
  # Sequential-hex placeholder private key used by signer/EIP-712 test
  # vectors (Lighter, edgeX) — with or without the 0x prefix.
  '''(0x)?0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef(0123456789abcdef)?''',
  # ExchangeAccounts.tsx input placeholder text — PEM header strings shown
  # as field hints, not real key material.
  '''-----BEGIN (RSA |EC )?PRIVATE KEY-----''',
  # commands.rs sanitization sentinels (SENTINEL_* strings asserting that
  # settings responses redact credential fields).
  '''SENTINEL_[A-Z0-9_]+''',
  # Dev placeholder HMAC token removed from the working tree (commit a88289d)
  '''enc-vault-a9f82d-k92''',
]
