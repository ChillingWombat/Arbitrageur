[package]
name = "arbitrageur-desktop"
version = "0.1.0"
edition = "2021"
authors = ["David"]
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
arbitrageur-core = { path = "../../crates/arbitrageur-core" }
arbitrageur-math = { path = "../../crates/arbitrageur-math" }
arbitrageur-exchanges = { path = "../../crates/arbitrageur-exchanges" }
arbitrageur-risk = { path = "../../crates/arbitrageur-risk" }
arbitrageur-execution = { path = "../../crates/arbitrageur-execution" }
arbitrageur-strategy = { path = "../../crates/arbitrageur-strategy" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { workspace = true }
# Single process-wide rustls crypto provider (alloy pulls providers that
# otherwise leave auto-detection ambiguous → runtime panic on first TLS).
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
# Standard Tauri production switch: enables `tauri/custom-protocol` so the
# webview serves the bundled `frontendDist` instead of `devUrl`. Plain
# `cargo build` (no features) compiles a dev-mode binary that expects the
# vite dev server on localhost:1420 — release binaries must be built with
# `--features custom-protocol` (or via `tauri build`, which sets it).
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2.1", features = ["test"] }
