[package]
name = "arbitrager-desktop"
version = "0.1.0"
edition = "2021"
authors = ["David"]
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
arbitrager-core = { path = "../../crates/arbitrager-core" }
arbitrager-math = { path = "../../crates/arbitrager-math" }
arbitrager-exchanges = { path = "../../crates/arbitrager-exchanges" }
arbitrager-risk = { path = "../../crates/arbitrager-risk" }
arbitrager-execution = { path = "../../crates/arbitrager-execution" }
arbitrager-strategy = { path = "../../crates/arbitrager-strategy" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { workspace = true }

[dev-dependencies]
tauri = { version = "2.1", features = ["test"] }
