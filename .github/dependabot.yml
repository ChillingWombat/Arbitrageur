version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "rand"
        versions:
          - ">= 0.9"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "vite"
        versions:
          - ">= 7.0"
      - dependency-name: "@vitejs/plugin-react"
        versions:
          - ">= 6.0"
      - dependency-name: "@types/node"
        versions:
          - ">= 25.0"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
