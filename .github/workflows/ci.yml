name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whitespace gate diffs the pushed/PR revision range, which
          # needs the base commit present — depth 1 cannot see it.
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev

      - name: Check patch whitespace
        # `git diff --check` with no range compares worktree to index —
        # empty on a clean checkout, gating nothing. Diff the actual
        # revision range being tested: PR base→head, or push before→head.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git merge-base HEAD origin/main || echo HEAD~1)"
          fi
          echo "Whitespace check range: $base...HEAD"
          git diff --check "$base"...HEAD

      - name: Verify vendored Lighter signer digest
        run: |
          echo "8cb2fbcadab0b9b3fed4a524998b825818b677fcf9c49bc1f18b4ca02a233753  crates/arbitrageur-exchanges/native/lighter/liblighter_signer.so" | sha256sum --check --status

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  signer-provenance:
    name: Lighter signer functional provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.6"

      - name: Verify vendored signer against pinned upstream source
        run: bash crates/arbitrageur-exchanges/native/lighter/verify/verify_provenance.sh

  supply-chain:
    name: Rust advisories and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Check Rust advisories
        run: cargo audit

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment:
    name: Headless deployment template validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Build headless binary
        run: cargo build --release --locked --bin arbitrageur

      - name: Assert Lighter signer ships beside the binary
        run: |
          # A missing sidecar silently drops Lighter out of deployed
          # builds — fail packaging rather than discover it on a host.
          test -f target/release/liblighter_signer.so
          echo "8cb2fbcadab0b9b3fed4a524998b825818b677fcf9c49bc1f18b4ca02a233753  target/release/liblighter_signer.so" | sha256sum --check --status

      - name: Install binary for unit verification
        run: sudo install -m 0755 target/release/arbitrageur /usr/local/bin/arbitrageur

      - name: Verify systemd unit templates
        run: |
          systemd-analyze verify ops/deploy/arbitrageur@.service ops/deploy/arbitrager@.service
          ! grep -R '\${' ops/deploy/*.service
