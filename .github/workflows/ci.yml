name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  # Format and lint are cheap (minutes); the workspace test suite is not
  # (tens of minutes — the desktop crate alone dominates). Splitting them
  # means a clippy or rustfmt failure reports in ~5 minutes instead of
  # hiding behind a 30-minute test run, and the two run in parallel.
  rust-lint:
    name: Rust format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whitespace gate diffs the pushed/PR revision range, which
          # needs the base commit present — depth 1 cannot see it.
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          # rustup's download is a plain curl under the hood: a slow mirror
          # fails the whole job with exit 101 after a 30 s stall. Retry it
          # here rather than re-running the job by hand.
          for attempt in 1 2 3; do
            rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy && break
            echo "rustup install attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          rustup run 1.96.0 rustc --version
          rustup default 1.96.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev

      - name: Check patch whitespace
        # `git diff --check` with no range compares worktree to index —
        # empty on a clean checkout, gating nothing. Diff the actual
        # revision range being tested: PR base→head, or push before→head.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git merge-base HEAD origin/main || echo HEAD~1)"
          fi
          echo "Whitespace check range: $base...HEAD"
          git diff --check "$base"...HEAD

      - name: Verify vendored Lighter signer digest
        run: |
          echo "8cb2fbcadab0b9b3fed4a524998b825818b677fcf9c49bc1f18b4ca02a233753  crates/arbitrageur-exchanges/native/lighter/liblighter_signer.so" | sha256sum --check --status

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust workspace tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    # Explicit ceiling rather than the 6 h default. The desktop crate is the
    # long pole — `stronghold::tests::rekey_snapshot…` alone measures ~229 s
    # of real KDF work (issue #117) and the full desktop suite measured ~46 min
    # on a cold runner, over the old 45 min ceiling — but a genuine hang must
    # fail the build instead of occupying a runner overnight.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One job per crate: the desktop suite is the long pole and no
        # longer blocks the fast crates from reporting.
        crate:
          - arbitrageur-core
          - arbitrageur-math
          - arbitrageur-risk
          - arbitrageur-exchanges
          - arbitrageur-execution
          - arbitrageur-strategy
          - arbitrageur-app
          - arbitrageur-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          # rustup's download is a plain curl under the hood: a slow mirror
          # fails the whole job with exit 101 after a 30 s stall. Retry it
          # here rather than re-running the job by hand.
          for attempt in 1 2 3; do
            rustup toolchain install 1.96.0 --profile minimal && break
            echo "rustup install attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          rustup run 1.96.0 rustc --version
          rustup default 1.96.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev

      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --locked

  # The `rust` job above only ever compiled on Linux, so every Windows and
  # macOS build break was invisible until someone tried to package. This is
  # the real gate: the whole workspace must type-check on all three desktop
  # OSes.
  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash ships on every runner image: one shell for all three OSes
        # instead of per-OS script forks.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          # rustup's download is a plain curl under the hood: a slow mirror
          # fails the whole job with exit 101 after a 30 s stall. Retry it
          # here rather than re-running the job by hand.
          for attempt in 1 2 3; do
            rustup toolchain install 1.96.0 --profile minimal && break
            echo "rustup install attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          rustup run 1.96.0 rustc --version
          rustup default 1.96.0

      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev

      - name: Compile-check the workspace
        # Clippy and the test suite stay on Linux (the `rust` job) — this job
        # is the portability gate, so it answers one question per OS: does
        # every crate in the workspace compile here?
        run: cargo check --workspace --locked --all-targets

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  signer-provenance:
    name: Lighter signer functional provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Verify vendored signer against pinned upstream source
        run: bash crates/arbitrageur-exchanges/native/lighter/verify/verify_provenance.sh

  supply-chain:
    name: Rust advisories and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          # rustup's download is a plain curl under the hood: a slow mirror
          # fails the whole job with exit 101 after a 30 s stall. Retry it
          # here rather than re-running the job by hand.
          for attempt in 1 2 3; do
            rustup toolchain install 1.96.0 --profile minimal && break
            echo "rustup install attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          rustup run 1.96.0 rustc --version

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Check Rust advisories
        run: cargo audit

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment:
    name: Headless deployment template validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          # rustup's download is a plain curl under the hood: a slow mirror
          # fails the whole job with exit 101 after a 30 s stall. Retry it
          # here rather than re-running the job by hand.
          for attempt in 1 2 3; do
            rustup toolchain install 1.96.0 --profile minimal && break
            echo "rustup install attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          rustup run 1.96.0 rustc --version

      - name: Build headless binary
        run: cargo build --release --locked --bin arbitrageur

      - name: Assert Lighter signer ships beside the binary
        run: |
          # A missing sidecar silently drops Lighter out of deployed
          # builds — fail packaging rather than discover it on a host.
          test -f target/release/liblighter_signer.so
          echo "8cb2fbcadab0b9b3fed4a524998b825818b677fcf9c49bc1f18b4ca02a233753  target/release/liblighter_signer.so" | sha256sum --check --status

      - name: Install binary for unit verification
        run: sudo install -m 0755 target/release/arbitrageur /usr/local/bin/arbitrageur

      - name: Verify systemd unit templates
        run: |
          systemd-analyze verify ops/deploy/arbitrageur@.service ops/deploy/arbitrageur-notify@.service
          ! grep -R '\${' ops/deploy/*.service
