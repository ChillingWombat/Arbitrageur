name: release

# Tag-triggered release pipeline (review §M-9): pushing a `v*` tag builds
# the actual trading binary (arbitrageur-desktop with the custom-protocol
# feature — the same artifact AGENTS.md prescribes for production), the
# headless CLI, and the digest-pinned Lighter signer sidecar; packages
# them with SHA-256 checksums and a CycloneDX SBOM; and publishes a
# GitHub release. All inputs are pinned (toolchain, --locked deps,
# actions) so the artifacts are reproducible by re-running the job.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  build-release:
    name: Build + publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Tauri/Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev

      - name: Build frontend bundle (embedded by the desktop binary)
        run: npm ci && npm run build
        working-directory: frontend

      - name: Build trading binary (custom-protocol)
        run: cargo build --release --locked -p arbitrageur-desktop --features custom-protocol

      - name: Build headless CLI
        run: cargo build --release --locked --bin arbitrageur

      - name: Verify Lighter signer sidecar digest
        # The build scripts copy the vendored signer beside each binary;
        # refuse to ship if the sidecar is missing or not the approved
        # byte stream.
        run: |
          test -f target/release/liblighter_signer.so
          echo "8cb2fbcadab0b9b3fed4a524998b825818b677fcf9c49bc1f18b4ca02a233753  target/release/liblighter_signer.so" \
            | sha256sum --check --status

      - name: Install cargo-sbom (pinned)
        run: cargo install cargo-sbom --locked --version 0.9.1

      - name: Generate SBOM
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cargo sbom --output-format=cyclone_dx_json_1_6 > "$GITHUB_WORKSPACE/dist/sbom.cdx.json"

      - name: Stage artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist/pkg"

          # Trading binary + its mandatory signer sidecar.
          stage="$dist/stage-desktop"
          mkdir -p "$stage"
          install -m 0755 target/release/arbitrageur-desktop "$stage/"
          install -m 0755 target/release/liblighter_signer.so "$stage/"
          tar -C "$stage" -czf "$dist/pkg/arbitrageur-desktop-${TAG}-linux-x86_64.tar.gz" .

          # Headless CLI + sidecar + ops tree (deploy recipe resolves
          # scripts under /opt/arbitrageur/ops).
          stage="$dist/stage-headless"
          mkdir -p "$stage/bin" "$stage/opt"
          install -m 0755 target/release/arbitrageur "$stage/bin/"
          install -m 0755 target/release/liblighter_signer.so "$stage/bin/"
          cp -a ops "$stage/opt/"
          tar -C "$stage" -czf "$dist/pkg/arbitrageur-headless-${TAG}-linux-x86_64.tar.gz" bin opt

      - name: Checksums
        run: |
          cd dist/pkg
          sha256sum *.tar.gz | tee SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum sbom.cdx.json > sbom.cdx.json.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Arbitrageur $TAG" \
            --notes "Automated release build. Artifacts: arbitrageur-desktop (Tauri trading binary, custom-protocol) and arbitrageur-headless (CLI + ops tree). Both tarballs include the digest-pinned Lighter signer sidecar; verify with SHA256SUMS.txt. Deploy per ops/deploy/README.md." \
            dist/pkg/*.tar.gz \
            dist/pkg/SHA256SUMS.txt \
            dist/sbom.cdx.json \
            dist/sbom.cdx.json.sha256
